# The rad-quant@home queue server on a plain Linux host (README "Server container", RUNBOOK.md). Settings come from
# .env next to this file (copy .env.example). Each *_DIR is a named volume by default; set it to a host path (with a /)
# for a bind mount. Every RADQUANT_* setting also takes its v0 name RXMQ_* (read in 0.2 only).
#
#   docker compose up -d                                  start (restarts on its own: unless-stopped)
#   docker compose ps                                     health: "healthy" once /healthz answers
#   docker compose exec server radquant admin list        admin commands inside the running container
#   docker compose run --rm admin datapack ...            admin with read-write data (datapack, ladder-add, manifest, check)
#   docker compose logs -f server; docker compose down    (down keeps the volumes; `down -v` deletes them)
#
# SELinux hosts (Fedora, RHEL, ...): set RADQUANT_SELINUX_RELABEL=1 so bind mounts get `:z` (shared container label;
# it relabels the host dirs recursively). Without it the container cannot open its database there.
#
# Port: published on the host's loopback only by default. Put a TLS terminator / tunnel in front before anything
# outside the host talks to it (the API is plain HTTP with bearer tokens).
name: ${RADQUANT_PROJECT:-${RXMQ_PROJECT:-radquant}}

x-common: &common
  image: ${RADQUANT_IMAGE:-${RXMQ_IMAGE:-radquant-server:0.2.0}}
  user: "${RADQUANT_UID:-${RXMQ_UID:-10001}}:${RADQUANT_GID:-${RXMQ_GID:-10001}}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  server:
    <<: *common
    command: ["serve"]
    restart: unless-stopped
    environment:
      RADQUANT_LEASE_S: ${RADQUANT_LEASE_S:-${RXMQ_LEASE_S:-120}}
      RADQUANT_HEARTBEAT_S: ${RADQUANT_HEARTBEAT_S:-${RXMQ_HEARTBEAT_S:-30}}
      RADQUANT_RETRY_S: ${RADQUANT_RETRY_S:-${RXMQ_RETRY_S:-30}}
      RADQUANT_MAX_LEASES: ${RADQUANT_MAX_LEASES:-${RXMQ_MAX_LEASES:-16}}
      RADQUANT_CHUNK_MAX_MB: ${RADQUANT_CHUNK_MAX_MB:-${RXMQ_CHUNK_MAX_MB:-64}}
      RADQUANT_UPLOAD_MAX_MB: ${RADQUANT_UPLOAD_MAX_MB:-${RXMQ_UPLOAD_MAX_MB:-0}}
      RADQUANT_SPOOL_MAX_GB: ${RADQUANT_SPOOL_MAX_GB:-${RXMQ_SPOOL_MAX_GB:-0}}
      RADQUANT_ADMIN_TOKEN_FILE: ${RADQUANT_ADMIN_TOKEN_FILE:-${RXMQ_ADMIN_TOKEN_FILE:-}}
      RADQUANT_SEARCH_TOKEN_FILE: ${RADQUANT_SEARCH_TOKEN_FILE:-}
      RADQUANT_SPOT_RATE: ${RADQUANT_SPOT_RATE:-0.04}
      RADQUANT_SPOT_FIRST: ${RADQUANT_SPOT_FIRST:-1}
      RADQUANT_GANG_WAIT_S: ${RADQUANT_GANG_WAIT_S:-0}
      # the public status page (served at /); STATUS_DIR also writes it for a static host, e.g. /srv/radquant/out/status;
      # CAMPAIGN defaults to campaign.json in the db directory
      RADQUANT_STATUS_INTERVAL: ${RADQUANT_STATUS_INTERVAL:-60}
      RADQUANT_STATUS_DIR: ${RADQUANT_STATUS_DIR:-}
      RADQUANT_CAMPAIGN: ${RADQUANT_CAMPAIGN:-}
      RADQUANT_RESERVE_MAX_S: ${RADQUANT_RESERVE_MAX_S:-21600}
      RADQUANT_VERBOSE: ${RADQUANT_VERBOSE:-${RXMQ_VERBOSE:-0}}
    ports:
      - "${RADQUANT_PUBLISH:-${RXMQ_PUBLISH:-127.0.0.1:8740}}:8740"
    volumes:
      - ${RADQUANT_DB_DIR:-${RXMQ_DB_DIR:-radquant-db}}:/srv/radquant/db${RADQUANT_SELINUX_RELABEL:+:z}
      - ${RADQUANT_DATA_DIR:-${RXMQ_DATA_DIR:-radquant-data}}:/srv/radquant/data:ro${RADQUANT_SELINUX_RELABEL:+,z}
      - ${RADQUANT_OUT_DIR:-${RXMQ_OUT_DIR:-radquant-out}}:/srv/radquant/out${RADQUANT_SELINUX_RELABEL:+:z}
      - ${RADQUANT_SOURCES_DIR:-${RXMQ_SOURCES_DIR:-radquant-sources}}:/srv/radquant/sources:ro${RADQUANT_SELINUX_RELABEL:+,z}
      - ${RADQUANT_SECRETS_DIR:-${RXMQ_SECRETS_DIR:-./secrets}}:/run/secrets/radquant:ro${RADQUANT_SELINUX_RELABEL:+,z}
    healthcheck:
      test: ["CMD", "python", "-I", "/opt/radquant/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
    stop_grace_period: 20s
    mem_limit: ${RADQUANT_MEM_LIMIT:-${RXMQ_MEM_LIMIT:-2g}}
    pids_limit: 512
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # one-off admin commands with read-write data: `docker compose run --rm admin COMMAND ...` (no network)
  admin:
    <<: *common
    profiles: [admin]
    entrypoint: ["radquant", "admin"]
    network_mode: none
    volumes:
      - ${RADQUANT_DB_DIR:-${RXMQ_DB_DIR:-radquant-db}}:/srv/radquant/db${RADQUANT_SELINUX_RELABEL:+:z}
      - ${RADQUANT_DATA_DIR:-${RXMQ_DATA_DIR:-radquant-data}}:/srv/radquant/data${RADQUANT_SELINUX_RELABEL:+:z}
      - ${RADQUANT_OUT_DIR:-${RXMQ_OUT_DIR:-radquant-out}}:/srv/radquant/out${RADQUANT_SELINUX_RELABEL:+:z}
      - ${RADQUANT_SOURCES_DIR:-${RXMQ_SOURCES_DIR:-radquant-sources}}:/srv/radquant/sources:ro${RADQUANT_SELINUX_RELABEL:+,z}
    mem_limit: ${RADQUANT_ADMIN_MEM_LIMIT:-${RXMQ_ADMIN_MEM_LIMIT:-8g}}
    cpus: ${RADQUANT_ADMIN_CPUS:-${RXMQ_ADMIN_CPUS:-8}}

volumes:
  radquant-db:
  radquant-data:
  radquant-out:
  radquant-sources:
