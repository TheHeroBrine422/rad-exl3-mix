# The queue server on a plain Linux host (README "Server container"). Settings come from .env next to this file
# (copy .env.example). Each *_DIR is a named volume by default; set it to a host path (with a /) for a bind mount.
#
#   docker compose up -d                                  start (restarts on its own: unless-stopped)
#   docker compose ps                                     health: "healthy" once /healthz answers
#   docker compose exec server rxmq admin list            admin commands inside the running container
#   docker compose run --rm admin datapack ...            admin with read-write data (datapack, manifest, check)
#   docker compose logs -f server; docker compose down    (down keeps the volumes; `down -v` deletes them)
#
# SELinux hosts (Fedora, RHEL, ...): set RXMQ_SELINUX_RELABEL=1 so bind mounts get `:z` (shared container label; it
# relabels the host dirs recursively). Without it the container cannot open its database there.
#
# Port: published on the host's loopback only by default. Put a TLS terminator / tunnel in front before anything
# outside the host talks to it (the API is plain HTTP with bearer tokens).
name: ${RXMQ_PROJECT:-rxmq}

x-common: &common
  image: ${RXMQ_IMAGE:-rxm-queue:0.1.0}
  user: "${RXMQ_UID:-10001}:${RXMQ_GID:-10001}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  server:
    <<: *common
    command: ["serve"]
    restart: unless-stopped
    environment:
      RXMQ_LEASE_S: ${RXMQ_LEASE_S:-120}
      RXMQ_HEARTBEAT_S: ${RXMQ_HEARTBEAT_S:-30}
      RXMQ_RETRY_S: ${RXMQ_RETRY_S:-30}
      RXMQ_MAX_LEASES: ${RXMQ_MAX_LEASES:-1}
      RXMQ_CHUNK_MAX_MB: ${RXMQ_CHUNK_MAX_MB:-64}
      RXMQ_UPLOAD_MAX_MB: ${RXMQ_UPLOAD_MAX_MB:-0}
      RXMQ_SPOOL_MAX_GB: ${RXMQ_SPOOL_MAX_GB:-0}
      RXMQ_ADMIN_TOKEN_FILE: ${RXMQ_ADMIN_TOKEN_FILE:-}
      RXMQ_VERBOSE: ${RXMQ_VERBOSE:-0}
    ports:
      - "${RXMQ_PUBLISH:-127.0.0.1:8740}:8740"
    volumes:
      - ${RXMQ_DB_DIR:-rxmq-db}:/srv/rxmq/db${RXMQ_SELINUX_RELABEL:+:z}
      - ${RXMQ_DATA_DIR:-rxmq-data}:/srv/rxmq/data:ro${RXMQ_SELINUX_RELABEL:+,z}
      - ${RXMQ_OUT_DIR:-rxmq-out}:/srv/rxmq/out${RXMQ_SELINUX_RELABEL:+:z}
      - ${RXMQ_SOURCES_DIR:-rxmq-sources}:/srv/rxmq/sources:ro${RXMQ_SELINUX_RELABEL:+,z}
      - ${RXMQ_SECRETS_DIR:-./secrets}:/run/secrets/rxmq:ro${RXMQ_SELINUX_RELABEL:+,z}
    healthcheck:
      test: ["CMD", "python", "-I", "/opt/rxmq/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s
      retries: 3
    stop_grace_period: 20s
    mem_limit: ${RXMQ_MEM_LIMIT:-2g}
    pids_limit: 512
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  # one-off admin commands with read-write data: `docker compose run --rm admin COMMAND ...` (no network)
  admin:
    <<: *common
    profiles: [admin]
    entrypoint: ["rxmq", "admin"]
    network_mode: none
    volumes:
      - ${RXMQ_DB_DIR:-rxmq-db}:/srv/rxmq/db${RXMQ_SELINUX_RELABEL:+:z}
      - ${RXMQ_DATA_DIR:-rxmq-data}:/srv/rxmq/data${RXMQ_SELINUX_RELABEL:+:z}
      - ${RXMQ_OUT_DIR:-rxmq-out}:/srv/rxmq/out${RXMQ_SELINUX_RELABEL:+:z}
      - ${RXMQ_SOURCES_DIR:-rxmq-sources}:/srv/rxmq/sources:ro${RXMQ_SELINUX_RELABEL:+,z}
    mem_limit: ${RXMQ_ADMIN_MEM_LIMIT:-8g}
    cpus: ${RXMQ_ADMIN_CPUS:-8}

volumes:
  rxmq-db:
  rxmq-data:
  rxmq-out:
  rxmq-sources:
